services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      XDEBUG_MODE: "${XDEBUG_MODE:-debug,develop}"
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    command: ["sh", "-lc", "exec tail -f /dev/null"]
    stdin_open: true
    tty: true
